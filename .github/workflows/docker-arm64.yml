name: Docker image (arm64)

# Builds the arm64 image (Dockerfile.arm64) on a native ARM runner and pushes
# ghcr.io/janlahmann/quantum-mixer:<full commit SHA> and :latest.
# RasQberry Two pins the image by commit tag (or digest) in its demo manifest
# and pulls it on the Raspberry Pi instead of building there for 15-30 minutes.
# A tag that already exists is not built again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/janlahmann/quantum-mixer

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already built?
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$GITHUB_SHA exists; not built again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.built != 'yes'

      - name: Build and push
        id: build
        if: steps.exists.outputs.built != 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.arm64
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/JanLahmann/quantum-mixer
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Quantum-Mixer
            org.opencontainers.image.version=${{ github.sha }}

      - name: Smoke test (the server answers)
        if: steps.exists.outputs.built != 'yes'
        run: |
          docker run -d --name mixer -p 8080:8080 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && { echo "answers after ${i}s"; break; }
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ >/dev/null || { docker logs mixer; exit 1; }
          docker rm -f mixer

      - name: Summary
        if: steps.exists.outputs.built != 'yes'
        run: |
          echo "Pushed $IMAGE:$GITHUB_SHA (and :latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
